services:
  patch-ldml:
    build:
      context: ..
      dockerfile: scripts/Dockerfile
    command: ["patch-ldml"]
    volumes:
      - ../xsd:/workspace/xsd:z
  verify-ldml:
    build:
      context: ..
      dockerfile: scripts/Dockerfile
    command: ["verify-ldml"]
    volumes:
      - ../xsd:/workspace/xsd:ro,z
      - ../samples:/workspace/samples:ro,z

name: verify-norms-schemas

permissions:
  contents: read

on:
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - "xsd/norm*"
  pull_request:
    branches: [main]
    paths:
      - "scripts/**"
      - "xsd/norm*"

jobs:
  verify-norms-schemas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build verify-norms-schemas
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: scripts/Dockerfile
          load: true
          tags: verify-norms-schemas
          cache-from: type=gha,scope=verify-norms-schemas
          cache-to: type=gha,scope=verify-norms-schemas,mode=max
      - name: Run verify-norms-schemas
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE/xsd:/workspace/xsd:ro" \
            verify-norms-schemas verify
